# ==============================================================================
# 🛡️  Security Monitor configuration
#
# Installed to /etc/security-monitor/security-monitor.conf. Both scripts source
# this file, so a value set here is the single source of truth — it is used for
# behaviour AND for what the dashboard reports.
#
# This file is sourced by bash. Re-run `sudo security-manager install` after
# changing a *_SCHEDULE value to rewrite the systemd timers.
# ==============================================================================

# --- Paths --------------------------------------------------------------------

# Runtime data (status.json, quarantine).
SECURITY_DIR="/var/lib/security-monitor"

# Logs (monitor.log, manager.log, install.log, scan-*.log).
LOG_DIR="/var/log/security-monitor"

# Where infected files are moved. Defaults to $SECURITY_DIR/quarantine.
# Created mode 0700, root-owned, and excluded from subsequent scans.
QUARANTINE_DIR=""

# --- Quarantine ---------------------------------------------------------------

# "yes" moves infected files to QUARANTINE_DIR (clamscan --move); "no" only
# reports them. Files are moved, never deleted, so a false positive is
# recoverable — but an application relying on a quarantined file will break
# until you move it back.
QUARANTINE_ENABLED="yes"

# --- Alerting -----------------------------------------------------------------

# Shell command run when a scan finds infected files. The alert subject and the
# matching clamscan lines are piped to it on stdin. Empty disables alerting.
#
# Examples:
#   ALERT_COMMAND="mail -s 'ClamAV alert' root"
#   ALERT_COMMAND="aws sns publish --topic-arn arn:aws:sns:eu-west-1:123:alerts --message \"\$(cat)\""
#   ALERT_COMMAND="curl -sS -X POST -H 'Content-Type: text/plain' --data-binary @- https://example.com/hook"
ALERT_COMMAND=""

# --- Schedule -----------------------------------------------------------------

# systemd OnCalendar expressions. Check syntax with:
#   systemd-analyze calendar "*-*-* 02:00:00"
SCAN_SCHEDULE="*-*-* 02:00:00"
HEALTH_SCHEDULE="*-*-* 00/6:00:00"

# Mode used by the scheduled scan: "quick" or "full".
SCAN_MODE="full"

# --- Scan scope ---------------------------------------------------------------

# Space-separated paths. Non-existent paths are skipped automatically.
QUICK_SCAN_PATHS="/home /root"
FULL_SCAN_PATHS="/home /root /opt /tmp /var /usr/local"

# --- Thresholds ---------------------------------------------------------------

# Virus definitions older than this are treated as stale by the dashboard and
# refreshed by the health check.
DB_MAX_AGE_DAYS="7"

# Scans older than this are reported as overdue by the dashboard.
SCAN_MAX_AGE_HOURS="48"

# Per-scan logs (scan-*.log) older than this are deleted after each scan.
LOG_RETENTION_DAYS="30"
